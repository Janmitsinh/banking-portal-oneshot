<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Maple Trust Bank</title><link rel="stylesheet" href="/styles.css"></head><body><header><span class="brand">Maple Trust Bank</span><nav><a href="/change-password.html">Change password</a> <button id="logout" class="secondary">Logout</button></nav></header><main><h1>Welcome, <span id="name"></span></h1><div id="status" class="muted">Loading your accounts...</div><section id="accounts" class="grid"></section><section class="panel"><div class="actions" style="justify-content:space-between"><h2>Recent Transactions</h2><button id="seed">Load sample data</button></div><div class="toolbar"><label for="search">Search description</label><input id="search" placeholder="e.g. grocery"><label for="category">Category</label><select id="category"><option value="">All categories</option><option>Salary</option><option>Groceries</option><option>Rent</option><option>Utilities</option><option>Transfers</option><option>Shopping</option></select></div><div id="tableStatus" class="muted"></div><div class="table-wrap"><table class="transactions"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/js/api.js"></script><script>
if(!sessionStorage.getItem('token'))location.href='/login.html';document.querySelector('#name').textContent=sessionStorage.getItem('fullName')||'Customer';let account;const money=c=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(c/100);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const accounts=await Api.request('/api/accounts');accountsEl.innerHTML='';if(!accounts.length){status.textContent='No accounts found.';return}account=accounts[0];accounts.forEach(a=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${esc(a.type)}</h2><p class="muted">Account ending in ${esc(a.accountId.slice(-4))}</p><p class="account-balance">${money(a.balance)}</p><p>${esc(a.currency)}</p>`;accountsEl.append(card)});await transactions()}catch(err){status.textContent=err.message}}async function transactions(){try{const params=new URLSearchParams({limit:'50'});if(search.value)params.set('q',search.value);if(category.value)params.set('category',category.value);const tx=await Api.request(`/api/accounts/${encodeURIComponent(account.accountId)}/transactions?${params}`);rows.innerHTML='';tableStatus.textContent=tx.length?'': 'No transactions match your filters.';tx.forEach(t=>{const tr=document.createElement('tr');const sign=t.amount>=0?'+':'-';tr.innerHTML=`<td>${esc(new Date(t.date).toLocaleDateString('en-CA'))}</td><td>${esc(t.description)}</td><td>${esc(t.category)}</td><td>${esc(t.type)}</td><td class="${t.amount>=0?'credit':'debit'}">${sign}${money(Math.abs(t.amount))}</td><td>${esc(t.status)}</td>`;rows.append(tr)})}catch(err){tableStatus.textContent=err.message}}const accountsEl=document.querySelector('#accounts');const status=document.querySelector('#status');const tableStatus=document.querySelector('#tableStatus');search.addEventListener('input',transactions);category.addEventListener('change',transactions);seed.addEventListener('click',async()=>{try{await Api.request('/api/dev/seed',{method:'POST'});await load()}catch(err){tableStatus.textContent=err.message}});logout.addEventListener('click',()=>{sessionStorage.clear();location.href='/login.html'});load();
</script></body></html>
