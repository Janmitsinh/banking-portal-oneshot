<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Maple Trust Bank</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">Maple Trust Bank</a></header><main><form class="panel form" id="registerForm"><h1>Create your account</h1><div id="serverError" class="error" role="alert"></div><div class="field"><label for="username">Username</label><input id="username" name="username" required autocomplete="username"><div class="error" id="usernameError"></div></div><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" required autocomplete="name"><div class="error" id="fullNameError"></div></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"><div class="error" id="emailError"></div></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="new-password"><div class="error" id="passwordError"></div></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password"><div class="error" id="confirmError"></div></div><button type="submit">Register</button><p>Already registered? <a href="/login.html">Log in</a></p></form></main><script src="/js/api.js"></script><script>
const form=document.querySelector('#registerForm');const msg=document.querySelector('#serverError');form.addEventListener('submit',async e=>{e.preventDefault();document.querySelectorAll('.error').forEach(x=>x.textContent='');const data=Object.fromEntries(new FormData(form));let valid=true;if(!data.username.trim()){usernameError.textContent='Username is required';valid=false}if(!data.fullName.trim()){fullNameError.textContent='Full name is required';valid=false}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){emailError.textContent='Enter a valid email';valid=false}if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(data.password)){passwordError.textContent='Use 8+ characters with a letter and number';valid=false}if(data.password!==data.confirmPassword){confirmError.textContent='Passwords do not match';valid=false}if(!valid)return;try{await Api.request('/api/register',{method:'POST',body:JSON.stringify(data)});location.href='/login.html?registered=1'}catch(err){msg.textContent=err.message}});</script></body></html>
