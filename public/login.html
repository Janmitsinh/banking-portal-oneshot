<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Maple Trust Bank</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">Maple Trust Bank</a></header><main><form class="panel form" id="loginForm"><h1>Log in</h1><div id="message" class="notice hidden"></div><div id="error" class="error" role="alert"></div><div class="field"><label for="username">Username</label><input id="username" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="actions"><button type="submit">Submit</button><button type="reset" class="secondary">Reset</button></div><p>New to Maple Trust? <a href="/register.html">Register</a></p></form></main><script src="/js/api.js"></script><script>
if(new URLSearchParams(location.search).get('registered')){message.textContent='Registration successful. Please log in.';message.classList.remove('hidden')}loginForm.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';try{const result=await Api.request('/api/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});sessionStorage.setItem('token',result.token);sessionStorage.setItem('fullName',result.fullName);location.href='/dashboard.html'}catch(err){error.textContent='Invalid username or password'}})
</script></body></html>
