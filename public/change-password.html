<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password | Maple Trust Bank</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/dashboard.html">Maple Trust Bank</a></header><main><form class="panel form" id="form"><h1>Change password</h1><div id="message" role="alert"></div><div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" required></div><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" required><div class="error" id="hint"></div></div><button>Change password</button></form></main><script src="/js/api.js"></script><script>if(!sessionStorage.getItem('token'))location.href='/login.html';form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';try{await Api.request('/api/changepassword',{method:'POST',body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});message.textContent='Password changed successfully.';form.reset()}catch(err){message.textContent=err.message}})</script></body></html>
